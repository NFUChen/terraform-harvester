#cloud-config
package_update: true
package_upgrade: false

users:
  - default
  - name: ubuntu
    groups: [adm, sudo]
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    ssh_authorized_keys:
%{ for key in ssh_authorized_keys ~}
      - ${key}
%{ endfor ~}
  - name: actions
    groups: [sudo]
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL

write_files:
  - path: /usr/local/sbin/configure-github-runner.sh
    owner: root:root
    permissions: "0700"
    content: |
      #!/bin/bash
      set -euo pipefail

      install -d -o actions -g actions /opt/actions-runner
      cd /opt/actions-runner

      curl --retry 10 --retry-all-errors --retry-delay 5 --connect-timeout 15 -fsSL \
        -o actions-runner.tar.gz \
        "https://github.com/actions/runner/releases/download/v${runner_version}/actions-runner-linux-x64-${runner_version}.tar.gz"
      echo "${runner_sha256}  actions-runner.tar.gz" | sha256sum -c -
      tar xzf actions-runner.tar.gz
      rm actions-runner.tar.gz
      chown -R actions:actions /opt/actions-runner

      config_args=(
        --unattended
        --url '${github_url}'
        --token '${registration_token}'
        --name '${runner_name}'
        --work _work
        --replace
%{ if runner_labels != "" ~}
        --labels '${runner_labels}'
%{ endif ~}
%{ if runner_group != null ~}
        --runnergroup '${runner_group}'
%{ endif ~}
      )

      sudo -u actions ./config.sh "$${config_args[@]}"
      ./svc.sh install actions
      ./svc.sh start

runcmd:
  - [install, -d, -m, "0755", /etc/apt/keyrings]
  - [bash, -c, "curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg -o /etc/apt/keyrings/githubcli-archive-keyring.gpg"]
  - [chmod, go+r, /etc/apt/keyrings/githubcli-archive-keyring.gpg]
  - [bash, -c, "echo 'deb [arch=amd64 signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main' > /etc/apt/sources.list.d/github-cli.list"]
  - [apt-get, update]
  - [apt-get, install, -y%{ for package in packages ~}, ${package}%{ endfor ~}, gh]
  - [systemctl, enable, --now, qemu-guest-agent]
%{ if install_docker ~}
  - [systemctl, enable, --now, docker]
  - [usermod, -aG, docker, actions]
%{ endif ~}
  - [/usr/local/sbin/configure-github-runner.sh]
