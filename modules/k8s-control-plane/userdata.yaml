#cloud-config
package_update: true
package_upgrade: false

users:
  - default
  - name: ubuntu
    groups: [adm, sudo]
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    ssh_authorized_keys:
%{ for key in ssh_authorized_keys ~}
      - ${key}
%{ endfor ~}

write_files:
  - path: /etc/modules-load.d/k8s.conf
    permissions: "0644"
    content: |
      overlay
      br_netfilter
  - path: /etc/sysctl.d/99-kubernetes-cri.conf
    permissions: "0644"
    content: |
      net.bridge.bridge-nf-call-iptables  = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward                 = 1
  - path: /etc/containerd/config.toml
    permissions: "0644"
    content: |
      version = 2
      [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.runc]
        runtime_type = "io.containerd.runc.v2"
        [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.runc.options]
          SystemdCgroup = true
  - path: /root/kubeadm-init.yaml
    permissions: "0600"
    content: |
      apiVersion: kubeadm.k8s.io/v1beta4
      kind: InitConfiguration
      bootstrapTokens:
        - token: "${join_token}"
          ttl: "0s"
      localAPIEndpoint:
        advertiseAddress: "${control_plane_ip}"
      nodeRegistration:
        kubeletExtraArgs:
          - name: "node-ip"
            value: "${control_plane_ip}"
      ---
      apiVersion: kubeadm.k8s.io/v1beta4
      kind: ClusterConfiguration
      networking:
        podSubnet: "${pod_network_cidr}"
      apiServer:
        certSANs:
%{ for san in split(",", apiserver_cert_sans) ~}
          - "${san}"
%{ endfor ~}

runcmd:
  - [swapoff, -a]
  - [sed, -ri, '/\sswap\s/s/^#?/#/', /etc/fstab]
  - [modprobe, overlay]
  - [modprobe, br_netfilter]
  - [sysctl, --system]
  - [apt-get, install, -y, ca-certificates, curl, gpg]
  - [install, -m, "0755", -d, /etc/apt/keyrings]
  - [sh, -c, "curl -fsSL https://pkgs.k8s.io/core:/stable:/v${kubernetes_version}/deb/Release.key | gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg"]
  - [sh, -c, "echo 'deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v${kubernetes_version}/deb/ /' > /etc/apt/sources.list.d/kubernetes.list"]
  - [apt-get, update]
  - [apt-get, install, -y, containerd, kubelet, kubeadm, kubectl, qemu-guest-agent, conntrack, ipset, ebtables, ethtool, socat]
  - [apt-mark, hold, kubelet, kubeadm, kubectl]
  - [systemctl, enable, --now, containerd]
  - [systemctl, enable, --now, qemu-guest-agent]
  - [sh, -c, "kubeadm init --config=/root/kubeadm-init.yaml && mkdir -p /home/ubuntu/.kube && cp /etc/kubernetes/admin.conf /home/ubuntu/.kube/config && chown -R ubuntu:ubuntu /home/ubuntu/.kube"]
  # Flannel is pinned by release and verified by checksum. Without a CNI every
  # node stays NotReady and CoreDNS stays Pending.
  - [sh, -c, "curl -fsSL -o /root/kube-flannel.yml https://github.com/flannel-io/flannel/releases/download/${flannel_version}/kube-flannel.yml && echo '${flannel_manifest_sha256}  /root/kube-flannel.yml' | sha256sum -c -"]
  - [sh, -c, "KUBECONFIG=/etc/kubernetes/admin.conf kubectl apply -f /root/kube-flannel.yml"]
