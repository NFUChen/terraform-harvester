#cloud-config
# control-plane generation: ${cluster_generation}
package_update: true
package_upgrade: false
ssh_pwauth: true

users:
  - default
  - name: ubuntu
    groups: [adm, sudo]
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    ssh_authorized_keys:
%{ for key in ssh_authorized_keys ~}
      - ${key}
%{ endfor ~}

chpasswd:
  expire: false
  users:
    - name: ubuntu
      password: ${ubuntu_password_hash}
      type: hash

write_files:
  - path: /etc/modules-load.d/k8s.conf
    permissions: "0644"
    content: |
      overlay
      br_netfilter
  - path: /etc/sysctl.d/99-kubernetes-cri.conf
    permissions: "0644"
    content: |
      net.bridge.bridge-nf-call-iptables  = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward                 = 1
  - path: /etc/containerd/config.toml
    permissions: "0644"
    content: |
      version = 2
      [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.runc]
        runtime_type = "io.containerd.runc.v2"
        [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.runc.options]
          SystemdCgroup = true
  - path: /etc/default/kubelet
    permissions: "0644"
    content: |
      KUBELET_EXTRA_ARGS=--node-ip=${node_ip}
%{ if length(persistent_mounts) > 0 ~}
  - path: /usr/local/bin/mount-persistent-disks.sh
    permissions: "0755"
    content: |
      #!/bin/sh
      # Idempotent: only formats a disk that has no filesystem yet, so a
      # replacement VM that reattaches the same PVC never wipes existing data.
      set -eu
%{ for mount in persistent_mounts ~}
      DEVICE="${mount.device}"
      MOUNT_PATH="${mount.mount_path}"
      FILESYSTEM="${mount.filesystem}"
      echo "mount-persistent-disks: checking $DEVICE for an existing filesystem"
      if ! blkid "$DEVICE" >/dev/null 2>&1; then
        echo "mount-persistent-disks: $DEVICE has no filesystem, creating $FILESYSTEM"
        mkfs.$FILESYSTEM "$DEVICE"
      else
        echo "mount-persistent-disks: $DEVICE already has a filesystem, skipping mkfs"
      fi
      UUID="$(blkid -s UUID -o value "$DEVICE")"
      echo "mount-persistent-disks: $DEVICE UUID=$UUID"
      mkdir -p "$MOUNT_PATH"
      if ! grep -q "^UUID=$UUID " /etc/fstab; then
        echo "mount-persistent-disks: adding fstab entry for $MOUNT_PATH"
        echo "UUID=$UUID $MOUNT_PATH $FILESYSTEM defaults,nofail 0 2" >> /etc/fstab
      else
        echo "mount-persistent-disks: fstab entry for $MOUNT_PATH already present"
      fi
      echo "mount-persistent-disks: mounting $MOUNT_PATH"
      mount "$MOUNT_PATH"
      echo "mount-persistent-disks: $MOUNT_PATH mounted ($(df -h "$MOUNT_PATH" | tail -1))"
%{ endfor ~}
%{ endif ~}

runcmd:
  - [swapoff, -a]
  - [sed, -ri, '/\sswap\s/s/^#?/#/', /etc/fstab]
  - [modprobe, overlay]
  - [modprobe, br_netfilter]
  - [sysctl, --system]
  - [apt-get, install, -y, ca-certificates, curl, gpg]
  - [install, -m, "0755", -d, /etc/apt/keyrings]
  - [sh, -c, "curl -fsSL https://pkgs.k8s.io/core:/stable:/v${kubernetes_version}/deb/Release.key | gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg"]
  - [sh, -c, "echo 'deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v${kubernetes_version}/deb/ /' > /etc/apt/sources.list.d/kubernetes.list"]
  - [apt-get, update]
  - [apt-get, install, -y, containerd, kubelet, kubeadm, qemu-guest-agent, conntrack, ipset, ebtables, ethtool, socat]
%{ if length([for mount in persistent_mounts : mount if mount.filesystem == "xfs"]) > 0 ~}
  - [apt-get, install, -y, xfsprogs]
%{ endif ~}
  - [apt-mark, hold, kubelet, kubeadm]
  - [systemctl, enable, kubelet]
  - [systemctl, enable, --now, containerd]
  - [systemctl, start, qemu-guest-agent]
%{ if length(persistent_mounts) > 0 ~}
  - [/usr/local/bin/mount-persistent-disks.sh]
%{ endif ~}
  - [sh, -c, "${join_command}"]
