#cloud-config
# control-plane generation: ${cluster_generation}
package_update: true
package_upgrade: false
ssh_pwauth: true

users:
  - default
  - name: ubuntu
    groups: [adm, sudo]
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    lock_passwd: false
    passwd: ${ubuntu_password_hash}
    ssh_authorized_keys:
%{ for key in ssh_authorized_keys ~}
      - ${key}
%{ endfor ~}

write_files:
  - path: /etc/modules-load.d/k8s.conf
    permissions: "0644"
    content: |
      overlay
      br_netfilter
  - path: /etc/sysctl.d/99-kubernetes-cri.conf
    permissions: "0644"
    content: |
      net.bridge.bridge-nf-call-iptables  = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward                 = 1
  - path: /etc/containerd/config.toml
    permissions: "0644"
    content: |
      version = 2
      [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.runc]
        runtime_type = "io.containerd.runc.v2"
        [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.runc.options]
          SystemdCgroup = true
  - path: /etc/default/kubelet
    permissions: "0644"
    content: |
      KUBELET_EXTRA_ARGS=--node-ip=${node_ip}
  - path: /usr/local/bin/worker-http.py
    permissions: "0755"
    content: |
      #!/usr/bin/env python3
      from http.server import BaseHTTPRequestHandler, HTTPServer
      from socket import gethostname

      class Handler(BaseHTTPRequestHandler):
          def do_GET(self):
              body = (gethostname() + "\n").encode()
              self.send_response(200)
              self.send_header("Content-Type", "text/plain")
              self.send_header("Content-Length", str(len(body)))
              self.end_headers()
              self.wfile.write(body)

          def log_message(self, *_):
              pass

      HTTPServer(("0.0.0.0", 80), Handler).serve_forever()
  - path: /etc/systemd/system/worker-http.service
    permissions: "0644"
    content: |
      [Unit]
      Description=Worker hostname HTTP test backend
      After=network-online.target
      Wants=network-online.target

      [Service]
      ExecStart=/usr/local/bin/worker-http.py
      Restart=always
      User=root

      [Install]
      WantedBy=multi-user.target

runcmd:
  - [swapoff, -a]
  - [sed, -ri, '/\sswap\s/s/^#?/#/', /etc/fstab]
  - [modprobe, overlay]
  - [modprobe, br_netfilter]
  - [sysctl, --system]
  - [apt-get, install, -y, ca-certificates, curl, gpg]
  - [install, -m, "0755", -d, /etc/apt/keyrings]
  - [sh, -c, "curl -fsSL https://pkgs.k8s.io/core:/stable:/v${kubernetes_version}/deb/Release.key | gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg"]
  - [sh, -c, "echo 'deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v${kubernetes_version}/deb/ /' > /etc/apt/sources.list.d/kubernetes.list"]
  - [apt-get, update]
  - [apt-get, install, -y, containerd, kubelet, kubeadm, qemu-guest-agent, conntrack, ipset, ebtables, ethtool, socat]
  - [apt-mark, hold, kubelet, kubeadm]
  - [systemctl, enable, --now, containerd]
  - [systemctl, start, qemu-guest-agent]
  - [systemctl, enable, --now, worker-http]
  - [sh, -c, "${join_command}"]
