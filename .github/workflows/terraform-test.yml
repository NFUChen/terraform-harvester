name: Terraform Test

on:
  pull_request:
    paths:
      - "modules/**"
      - ".github/workflows/terraform-test.yml"

permissions:
  contents: read

jobs:
  discover-modules:
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.find.outputs.modules }}
    steps:
      - uses: actions/checkout@v4

      - name: Find modules with tests
        id: find
        run: |
          modules=$(find modules -mindepth 1 -maxdepth 1 -type d -exec test -d "{}/tests" \; -print | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "modules=${modules}" >> "$GITHUB_OUTPUT"

  terraform-test:
    needs: discover-modules
    if: needs.discover-modules.outputs.modules != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.discover-modules.outputs.modules) }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.12.2"
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: ${{ matrix.module }}
        run: terraform init -backend=false

      - name: Terraform Test
        working-directory: ${{ matrix.module }}
        shell: bash
        run: |
          set +e
          terraform test -no-color 2>&1 | tee terraform-test.log
          status=${PIPESTATUS[0]}

          if (( status != 0 )); then
            {
              echo "## Failed: \`${{ matrix.module }}\`"
              echo
              echo '```text'
              cat terraform-test.log
              echo '```'
              echo
            } > terraform-test-summary-${{ strategy.job-index }}.md
          else
            : > terraform-test-summary-${{ strategy.job-index }}.md
          fi

          exit "$status"

      - name: Upload test summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-test-summary-${{ strategy.job-index }}
          path: ${{ matrix.module }}/terraform-test-summary-${{ strategy.job-index }}.md
          if-no-files-found: error

  test-summary:
    if: always()
    needs: terraform-test
    runs-on: ubuntu-latest
    steps:
      - name: Download module summaries
        uses: actions/download-artifact@v4
        with:
          pattern: terraform-test-summary-*
          path: terraform-test-summaries
          merge-multiple: true

      - name: Write job summary
        shell: bash
        run: |
          echo "# Terraform Test Summary" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"

          if grep -q '^## Failed:' terraform-test-summaries/*.md; then
            cat terraform-test-summaries/*.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "All Terraform tests passed." >> "$GITHUB_STEP_SUMMARY"
          fi
